<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lite Slack Media Sender</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 440px; margin: 2rem auto; padding: 0 1rem; color: #111; }
    label { display: block; font-weight: 600; margin-top: 1rem; margin-bottom: 0.35rem; }
    input, select, button { width: 100%; padding: 0.65rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #4A154B; color: #fff; font-weight: 600; border: none; margin-top: 1.25rem; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .meta { font-size: 0.85rem; color: #555; margin-top: 0.4rem; }
    #status { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h2>Lite Slack Media Sender</h2>

  <label for="sender">Your Name</label>
  <input id="sender" type="text" placeholder="e.g. Alex" required />

  <label for="channel">Slack Channel</label>
  <select id="channel"><option>Loading channels...</option></select>

  <label for="media">Select Photos or Short Videos (max 5.5 MB total)</label>
  <input id="media" type="file" accept="image/*,video/*" multiple />
  <div id="sizeInfo" class="meta"></div>

  <label for="caption">Caption (optional)</label>
  <input id="caption" type="text" placeholder="Add a quick note..." />

  <button id="sendBtn" onclick="sendMedia()">Optimize & Send to Slack</button>
  <div id="status"></div>

  <script>
    const senderInput = document.getElementById('sender');
    const channelSelect = document.getElementById('channel');
    const mediaInput = document.getElementById('media');
    const sizeInfo = document.getElementById('sizeInfo');
    const statusDiv = document.getElementById('status');
    const sendBtn = document.getElementById('sendBtn');

    senderInput.value = localStorage.getItem('slack_sender_name') || '';
    senderInput.addEventListener('input', () => localStorage.setItem('slack_sender_name', senderInput.value));

    fetch('/api/channels')
      .then(r => r.json())
      .then(data => {
        if (data.channels && data.channels.length) {
          channelSelect.innerHTML = data.channels
            .map(c => `<option value="${c.id}">#${c.name}</option>`)
            .join('');
        } else {
          channelSelect.innerHTML = '<option value="">No channels found (invite bot first)</option>';
        }
      });

    function compressImage(file, maxWidth = 1280, quality = 0.75) {
      return new Promise((resolve) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.src = objectUrl;
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(objectUrl);
          canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
        };
      });
    }

    async function sendMedia() {
      const files = Array.from(mediaInput.files);
      const channelId = channelSelect.value;
      const senderName = senderInput.value.trim();

      if (!senderName) return alert('Please enter your name.');
      if (!channelId) return alert('Please select a channel.');
      if (!files.length) return alert('Please choose at least one photo or video.');
      if (files.length > 10) return alert('Please select up to 10 files at a time.');

      sendBtn.disabled = true;
      sizeInfo.textContent = '';

      try {
        const formData = new FormData();
        formData.append('channelId', channelId);
        formData.append('senderName', senderName);
        formData.append('caption', document.getElementById('caption').value.trim());

        let totalOrigBytes = 0;
        let totalNewBytes = 0;

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          totalOrigBytes += file.size;

          if (file.type.startsWith('image/')) {
            statusDiv.textContent = `Compressing image ${i + 1} of ${files.length}...`;
            const compressedBlob = await compressImage(file);
            totalNewBytes += compressedBlob.size;
            formData.append('photos', compressedBlob, `photo_${i + 1}.jpg`);
          } else if (file.type.startsWith('video/')) {
            statusDiv.textContent = `Preparing video ${i + 1} of ${files.length}...`;
            totalNewBytes += file.size;
            formData.append('photos', file, file.name || `video_${i + 1}.mp4`);
          }
        }

        // Check Netlify's 6 MB serverless payload limit before uploading
        const maxBytes = 5.5 * 1024 * 1024;
        if (totalNewBytes > maxBytes) {
          const totalMB = (totalNewBytes / (1024 * 1024)).toFixed(1);
          statusDiv.textContent = `Too large (${totalMB} MB). Keep videos short or under 5.5 MB total.`;
          sendBtn.disabled = false;
          return;
        }

        const origKB = Math.round(totalOrigBytes / 1024);
        const newKB = Math.round(totalNewBytes / 1024);
        sizeInfo.textContent = `Upload size (${files.length} file${files.length > 1 ? 's' : ''}): ${origKB} KB → ${newKB} KB`;

        statusDiv.textContent = `Uploading to Slack...`;
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const result = await res.json();

        if (result.ok) {
          statusDiv.textContent = `Sent to Slack!`;
          mediaInput.value = '';
          document.getElementById('caption').value = '';
        } else {
          statusDiv.textContent = 'Error: ' + result.error;
        }
      } catch (err) {
        statusDiv.textContent = 'Upload failed. Check connection and try again.';
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
